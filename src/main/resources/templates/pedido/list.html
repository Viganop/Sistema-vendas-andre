<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Listagem de Pedidos</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<div class="container mt-4">
    <h1>Pedidos</h1>
    <a class="btn btn-primary mb-3" th:href="@{/pedidos/novo}">Novo Pedido</a>
    <a class="btn btn-secondary mb-3" sec:authorize="hasRole('ADMIN')" th:href="@{/clientes}">Clientes</a>
    <a class="btn btn-secondary mb-3" sec:authorize="hasRole('ADMIN')" th:href="@{/produtos}">Produtos</a>

    <table class="table table-bordered table-striped">
        <thead class="thead-dark">
        <tr>
            <th>Nº</th>
            <th>Cliente</th>
            <th>Data</th>
            <th>Valor Total</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pedido : ${pedidos}">
            <td th:text="${pedido.id}"></td>
            <td th:text="${pedido.cliente.nome}"></td>
            <td th:text="${pedido.data_pedido.dayOfMonth} + '/' + ${pedido.data_pedido.monthValue} + '/' + ${pedido.data_pedido.year}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
            <td>
                <span class="badge bg-success" th:if="${pedido.status.name() == 'ATIVO'}">Ativo</span>
                <span class="badge bg-danger" th:if="${pedido.status.name() == 'CANCELADO'}">Cancelado</span>
            </td>
            <td>
                <a class="btn btn-sm btn-warning" th:if="${pedido.status.name() == 'ATIVO'}"
                   th:href="@{/pedidos/edit/{id}(id=${pedido.id})}">Editar</a>
                <a class="btn btn-sm btn-danger" th:if="${pedido.status.name() == 'ATIVO'}"
                   th:href="@{/pedidos/cancelar/{id}(id=${pedido.id})}">Cancelar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
