<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Cancelar Pedido</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<div class="container mt-4">
    <h1>Cancelar Pedido</h1>

    <div class="alert alert-danger">
        <p>Tem certeza que deseja cancelar o pedido <strong th:text="'#' + ${pedido.id}"></strong>?
           Os itens serão devolvidos ao estoque.</p>
    </div>

    <table class="table table-bordered">
        <tr>
            <th>Cliente</th>
            <td th:text="${pedido.cliente.nome}"></td>
        </tr>
        <tr>
            <th>Data</th>
            <td th:text="${pedido.data_pedido.dayOfMonth} + '/' + ${pedido.data_pedido.monthValue} + '/' + ${pedido.data_pedido.year}"></td>
        </tr>
        <tr>
            <th>Itens</th>
            <td>
                <ul class="mb-0">
                    <li th:each="item : ${pedido.itens}"
                        th:text="${item.quantidade} + 'x ' + ${item.produto.nome}"></li>
                </ul>
            </td>
        </tr>
        <tr>
            <th>Valor Total</th>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
        </tr>
    </table>

    <form th:action="@{/pedidos/cancelar/{id}(id=${pedido.id})}" method="post">
        <button type="submit" class="btn btn-danger">Confirmar Cancelamento</button>
        <a th:href="@{/pedidos}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
